# 带符号倒位审计 —— 纯静态站点编排，无业务后端 / 无持久化 / 无在线调用。
#
# 宿主机端口通过环境变量 WEB_PORT 配置（默认 8080）：
#   WEB_PORT=9090 docker compose up -d --build

services:
  web:
    build:
      context: .
      target: web
    image: signed-reversal-audit-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # 一次性验收服务：代码测试 → 构建检查 → 待页面可访问后 HTTP 冒烟
  # → 需求断言（[1,-3,-2,4] 最短步数为 1；重复绝对值被拒绝）。
  # 以退出码报告：全部通过为 0，任一失败非 0。
  # 置于 verify profile：普通 `compose up` 不触发，按需运行
  #   docker compose run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    image: signed-reversal-audit-verify:latest
    environment:
      BASE_URL: http://web/
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
